services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose: ["8000"]
    volumes: ["./data:/app/data"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:?Set POSTGRES_DB in .env}
      - DB_USER=${POSTGRES_USER:?Set POSTGRES_USER in .env}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - DB_CONNECT_TIMEOUT_SECONDS=${DB_CONNECT_TIMEOUT_SECONDS:-3}
      - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in .env (openssl rand -hex 32)}
      - ACCESS_TOKEN_LIFETIME_MINUTES=${ACCESS_TOKEN_LIFETIME_MINUTES:-30}
      - ALLOW_PUBLIC_REPORTER_REGISTRATION=${ALLOW_PUBLIC_REPORTER_REGISTRATION:-false}
      - INTEGRATION_ENCRYPTION_KEY=${INTEGRATION_ENCRYPTION_KEY:?Set INTEGRATION_ENCRYPTION_KEY in .env}
      - SECURITY_ADMIN_EMAIL=${SECURITY_ADMIN_EMAIL:?Set SECURITY_ADMIN_EMAIL in .env}
      - SECURITY_ADMIN_PASSWORD=${SECURITY_ADMIN_PASSWORD:?Set SECURITY_ADMIN_PASSWORD in .env}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:3000,http://localhost:3000}
      - API_DOCS_ENABLED=${API_DOCS_ENABLED:-false}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_ENABLED=${LLM_ENABLED:-false}
      - CRISPR_DATA_MODE=${CRISPR_DATA_MODE:-live}
      - DEMO_AUTO_SEED=${DEMO_AUTO_SEED:-false}
      - NVD_API_KEY=${NVD_API_KEY:-}
      - NVD_USER_AGENT=${NVD_USER_AGENT:-CRISPR-risk-platform/1.0}
      - NVD_REQUEST_INTERVAL_SECONDS=${NVD_REQUEST_INTERVAL_SECONDS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
        VITE_API_MODE: live
    ports: ["5173:80"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.workers.main"]
    volumes: ["./data:/app/data"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:?Set POSTGRES_DB in .env}
      - DB_USER=${POSTGRES_USER:?Set POSTGRES_USER in .env}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - DB_CONNECT_TIMEOUT_SECONDS=${DB_CONNECT_TIMEOUT_SECONDS:-3}
      - INTEGRATION_ENCRYPTION_KEY=${INTEGRATION_ENCRYPTION_KEY:?Set INTEGRATION_ENCRYPTION_KEY in .env}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - crispr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  bug-bounty:
    build:
      context: ./bug-bounty
      args:
        VITE_API_URL: ""
    ports: ["3000:80"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  crispr_postgres_data:
