name: CRISPR CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: unit-test-signing-material-not-for-deployment
      SECURITY_ADMIN_EMAIL: security-test@example.com
      SECURITY_ADMIN_PASSWORD: unit-test-password
      POSTGRES_DB: crispr_test
      POSTGRES_USER: crispr_test
      POSTGRES_PASSWORD: unit-test-postgres-password
      CRISPR_DATA_MODE: demo
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m compileall -q backend ml ai

    - name: Run Tests
      run: |
        pytest backend/ -q

    - name: Build frontend
      working-directory: frontend
      run: |
        npm ci
        npm run build

    - name: Docker build
      run: |
        docker compose build
